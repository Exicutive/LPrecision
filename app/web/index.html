<main>
  <h1>Land Boundary Engine</h1>
  <p>Step 1: upload a DXF survey plan and inspect its candidate parcel boundaries.</p>

  <form id="upload-form">
    <label for="dxf-file">Survey plan (.dxf)</label>
    <input id="dxf-file" name="file" type="file" accept=".dxf" required>
    <button type="submit">Inspect plan</button>
  </form>

  <p id="status" aria-live="polite"></p>
  <section id="results" hidden>
    <h2>Candidate boundaries</h2>
    <p id="summary"></p>
    <table>
      <thead>
        <tr><th>Layer</th><th>Entity</th><th>Vertices</th><th>Area</th><th>Perimeter</th><th>Warnings</th></tr>
      </thead>
      <tbody id="boundary-results"></tbody>
    </table>
  </section>
</main>

<style>
  body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #1f2937; }
  form { display: flex; align-items: end; flex-wrap: wrap; gap: 1rem; padding: 1rem; background: #f3f4f6; }
  label, input { display: block; }
  button { background: #14532d; border: 0; color: white; padding: .7rem 1rem; font: inherit; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #d1d5db; padding: .6rem; text-align: left; vertical-align: top; }
  .error { color: #b91c1c; }
</style>

<script>
  const form = document.querySelector('#upload-form');
  const status = document.querySelector('#status');
  const results = document.querySelector('#results');
  const summary = document.querySelector('#summary');
  const rows = document.querySelector('#boundary-results');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    status.className = '';
    status.textContent = 'Reading DXF…';
    results.hidden = true;
    const response = await fetch('/api/dxf/inspect', { method: 'POST', body: new FormData(form) });
    const data = await response.json();
    if (!response.ok) {
      status.className = 'error';
      status.textContent = data.detail || 'Could not inspect the DXF.';
      return;
    }
    status.textContent = 'Inspection complete.';
    summary.textContent = `${data.candidate_boundaries.length} polyline candidates found across ${data.layers.length} layers. ${data.message}`;
    rows.replaceChildren(...data.candidate_boundaries.map((candidate) => {
      const analysis = candidate.analysis;
      const row = document.createElement('tr');
      const values = [
        candidate.layer,
        candidate.entity_type,
        candidate.vertex_count,
        analysis.area_square_units.toFixed(3),
        analysis.perimeter_units.toFixed(3),
        analysis.warnings.join(' ') || 'None'
      ];
      values.forEach((value) => {
        const cell = document.createElement('td');
        cell.textContent = value;
        row.append(cell);
      });
      return row;
    }));
    results.hidden = false;
  });
</script>
